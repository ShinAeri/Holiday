# 로컬 Docker MySQL 설정
spring.datasource.url=jdbc:mysql://localhost:3306/trip_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate 설정 (로컬에서는 콘솔에 SQL 로그 출력)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT 설정
jwt.secret=holidayTravelServiceSecretKeyForJwtTokenGenerationMustBeVeryLong32BytesAbove!
jwt.expiration=86400000