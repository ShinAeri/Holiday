# 운영 환경에서는 환경 변수(Environment Variable)를 주입받아 보안 유지
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/trip_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 운영 환경에서는 테이블 자동 변경 방지 및 SQL 숨김 처리
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JWT 설정 (운영 키 환경변수 주입)
jwt.secret=${JWT_SECRET:holidayTravelServiceSecretKeyForJwtTokenGenerationMustBeVeryLong32BytesAbove!}
jwt.expiration=86400000