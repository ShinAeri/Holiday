# 서버 포트
server.port=8080

# MySQL trip_db 연결 설정
spring.datasource.url=jdbc:mysql://localhost:3306/trip_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA 테이블 자동 관리 및 SQL 로그 출력
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT 서명용 비밀키 (256비트 이상 긴 무작위 문자열)
jwt.secret=holidayTravelRecommendationServiceSecretKey2026SecureStringForJwtTokenGeneration
jwt.expiration=86400000